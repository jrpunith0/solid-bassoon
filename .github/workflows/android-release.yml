name: Android production release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify signing and build release AAB
    runs-on: ubuntu-latest
    environment: production
    env:
      KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
      RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36.1 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore and validate production upload keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail

          for name in RELEASE_KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD RELEASE_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required production signing setting is missing: $name"
              exit 1
            fi
          done

          expected="$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          if [[ ! "$expected" =~ ^[A-F0-9]{64}$ ]]; then
            echo "::error::RELEASE_CERT_SHA256 must be a 64-character SHA-256 hex fingerprint."
            exit 1
          fi

          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          # Opening the keystore with the supplied store password and requesting
          # the required alias verifies both the keystore password and alias.
          keytool -list -v -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" -alias upload \
            > "$RUNNER_TEMP/upload-alias-details.txt"

          actual="$(sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            "$RUNNER_TEMP/upload-alias-details.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"

          if [[ ! "$actual" =~ ^[A-F0-9]{64}$ ]]; then
            echo "::error::Could not read a valid SHA-256 certificate fingerprint for alias upload."
            exit 1
          fi
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Upload keystore certificate fingerprint does not match RELEASE_CERT_SHA256."
            exit 1
          fi

          echo "Upload keystore opened; alias exists; certificate fingerprint matches."

      - name: Build signed release Android App Bundle
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-configuration-cache :app:bundleRelease

      - name: Verify signed AAB and embedded certificate fingerprint
        shell: bash
        run: |
          set -euo pipefail
          aab="app/build/outputs/bundle/release/app-release.aab"
          test -s "$aab"

          # Verify that the AAB contains a valid JAR signature.
          jarsigner -verify -verbose -certs "$aab" > "$RUNNER_TEMP/aab-signature-verification.txt"

          # Independently inspect the certificate embedded in the AAB.
          keytool -printcert -jarfile "$aab" > "$RUNNER_TEMP/aab-certificate.txt"
          actual="$(sed -nE 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            "$RUNNER_TEMP/aab-certificate.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          expected="$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"

          if [[ "$actual" != "$expected" ]]; then
            echo "::error::The signed AAB certificate fingerprint does not match RELEASE_CERT_SHA256."
            exit 1
          fi

          echo "Signed AAB verified; embedded certificate fingerprint matches."

      - name: Upload verified release AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f "${KEYSTORE_PATH:-}"
